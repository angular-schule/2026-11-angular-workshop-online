<p>{{ time$ | async }}</p>

<p>{{ currentTimestamp() | date:'medium' }}</p>

<p>Status: {{ books.status() }}</p>

<button type="button" class="btn btn-yellow"
    (click)="books.reload()">Reload</button>

@if (books.hasValue()) {
    <p>Anzahl Bücher: {{ books.value().length }}</p>

    @for (b of books.value(); track b.isbn) {
        <app-book-card
            [book]="b"
            [minRating]="1"
            [maxRating]="5"
            (rateUp)="doRateUp($event)"
            (rateDown)="doRateDown($event)"
            (delete)="doDelete($event)" />
    }
}
