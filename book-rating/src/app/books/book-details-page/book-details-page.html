@if (book.hasValue()) {
<h2>{{ book.value().title }}</h2>
<p>{{ book.value().description }}</p>
}

@if (book.status() === 'error') {
    <p>ERROR: {{ book.error() | json }}</p>
}

<hr>


@boundary {
    {{ book.value() | json }}
} @error (let e) {
    <p>ERROR! {{ e }}</p>
}
