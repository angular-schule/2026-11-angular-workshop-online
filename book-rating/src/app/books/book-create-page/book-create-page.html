<h2>Buch erstellen</h2>

<p>submitting: {{ bookForm().submitting() }}</p>

<form [formRoot]="bookForm">
    <div class="form-group">
        <label for="isbnInput">ISBN</label>
        <input type="text" id="isbnInput" class="form-control"
            [aria-invalid]="bookForm.isbn().touched() ? bookForm.isbn().invalid() : null"
            [aria-errormessage]="bookForm.isbn().touched() && bookForm.isbn().invalid() ? 'isbnErrors' : null"
            [formField]="bookForm.isbn" />
        
        @if (bookForm.isbn().touched() && bookForm.isbn().invalid()) {
            <div class="feedback-error" id="isbnErrors">
                @for (e of bookForm.isbn().errors(); track e) {
                    <p>{{ e.message }}</p>
                }
            </div>
        }
    </div>
    
    <div class="form-group">
        <label for="titleInput">Titel</label>
        <input type="text" id="titleInput" class="form-control"
            [formField]="bookForm.title" />
    </div>

    <div class="form-group">
        <label for="descInput">Beschreibung</label>
        <textarea id="descInput" class="form-control"
            [formField]="bookForm.description"></textarea>
    </div>
    
    <div class="form-group">
        <label for="priceInput">Preis</label>
        <input type="number" id="priceInput" class="form-control"
            [formField]="bookForm.price" />
    </div>
    
    <div class="form-group">
        <label for="ratingInput">Bewertung</label>
        <input type="number" id="ratingInput" class="form-control"
            [formField]="bookForm.rating" />
    </div>

    <fieldset>
        <legend>Autoren</legend>
        <button type="button" class="btn btn-yellow" (click)="addAuthorField()">+ Autor</button>

        @for (authorField of bookForm.authors; track authorField) {
            <input type="text" class="form-control" [formField]="authorField" [aria-label]="`Autor ${$index + 1}`" />
        }
    </fieldset>

    <button type="submit" class="btn btn-green">Abschicken</button>
</form>

<pre>{{ bookFormData() | json }}</pre>
